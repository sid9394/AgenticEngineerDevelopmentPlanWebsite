<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Quest Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e12;
      --surface: #16161c;
      --surface2: #1e1e26;
      --border: #2a2a38;
      --accent: #7c6af7;
      --accent2: #4fcf8e;
      --accent3: #f7c06a;
      --accent4: #f76a8a;
      --text: #e8e8f0;
      --muted: #7a7a96;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 2rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .header-left h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .header-left p { font-size: 13px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }
    .date-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
    }

    .xp-bar-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .xp-bar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .xp-label { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .xp-num { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent); }
    .xp-track { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(.4,2,.6,1);
    }
    .level-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .level-chip {
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid;
    }
    .lv-ai  { color: #7c6af7; border-color: #7c6af740; background: #7c6af710; }
    .lv-dsa { color: #4fcf8e; border-color: #4fcf8e40; background: #4fcf8e10; }
    .lv-web { color: #f7c06a; border-color: #f7c06a40; background: #f7c06a10; }

    .section-title {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .quests { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
    .quest {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .quest:hover { border-color: #3a3a52; background: var(--surface2); }
    .quest.done { opacity: 0.5; }
    .quest.done .quest-name { text-decoration: line-through; color: var(--muted); }
    .quest-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      background: transparent;
    }
    .quest.done .quest-check { background: var(--accent2); border-color: var(--accent2); }
    .quest-check svg { display: none; }
    .quest.done .quest-check svg { display: block; }
    .quest-info { flex: 1; }
    .quest-name { font-size: 14px; font-weight: 500; }
    .quest-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
    .quest-xp {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .xp-ai    { color: #7c6af7; background: #7c6af715; }
    .xp-dsa   { color: #4fcf8e; background: #4fcf8e15; }
    .xp-web   { color: #f7c06a; background: #f7c06a15; }
    .xp-bonus { color: #f76a8a; background: #f76a8a15; }

    .rewards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .reward-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      transition: all 0.3s;
    }
    .reward-card.unlocked { border-color: var(--accent2); background: #4fcf8e08; }
    .reward-card.locked { opacity: 0.5; }
    .reward-icon { font-size: 24px; margin-bottom: 8px; }
    .reward-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .reward-xp { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .reward-card.unlocked .reward-xp { color: var(--accent2); }
    .unlock-badge {
      display: inline-block;
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #4fcf8e20;
      color: var(--accent2);
      border: 1px solid #4fcf8e40;
    }

    .streak-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .streak-day {
      flex: 1;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 4px;
    }
    .streak-day.active { background: #7c6af715; border-color: #7c6af750; }
    .streak-day .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      margin: 0 auto 4px;
    }
    .streak-day.active .dot { background: var(--accent); }
    .streak-day .day-label { font-family: var(--mono); font-size: 10px; color: var(--muted); }

    .reset-btn {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      transition: all 0.2s;
    }
    .reset-btn:hover { color: var(--text); border-color: var(--muted); }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent2);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <h1>Daily Quest Board</h1>
      <p>// complete quests → earn XP → unlock rewards</p>
    </div>
    <div class="date-badge" id="dateBadge"></div>
  </div>

  <div class="xp-bar-wrap">
    <div class="xp-bar-top">
      <span class="xp-label">DAILY XP</span>
      <span class="xp-num" id="xpCount">0 / 400 XP</span>
    </div>
    <div class="xp-track"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
    <div class="level-row">
      <div class="level-chip lv-ai"  id="chip-ai">⬡ AI/RAG — LV 1</div>
      <div class="level-chip lv-dsa" id="chip-dsa">⬡ DSA — LV 1</div>
      <div class="level-chip lv-web" id="chip-web">⬡ Web — LV 1</div>
    </div>
  </div>

  <div class="section-title">Today's quests</div>
  <div class="quests" id="questList"></div>

  <div class="section-title">Streak</div>
  <div class="streak-row" id="streakRow"></div>

  <div class="section-title" style="margin-top:1.5rem">Rewards</div>
  <div class="rewards-grid" id="rewardsGrid"></div>

  <button class="reset-btn" onclick="resetDay()">↺ reset day</button>
  <div class="toast" id="toast"></div>

  <script>
    const QUESTS = [
      { id:'q1', name:'LeetCode problem',       sub:'1 easy/medium — NeetCode 150',          xp:50,  tag:'dsa',   cls:'xp-dsa'   },
      { id:'q2', name:'RAG / Agents session',   sub:'45 min hands-on build time',             xp:80,  tag:'ai',    cls:'xp-ai'    },
      { id:'q3', name:'System design concept',  sub:'1 topic — e.g. URL shortener',           xp:60,  tag:'dsa',   cls:'xp-dsa'   },
      { id:'q4', name:'AI reading / course',    sub:'DeepLearning.AI or Anthropic cookbook',  xp:50,  tag:'ai',    cls:'xp-ai'    },
      { id:'q5', name:'Website work',           sub:'Any progress on portfolio',              xp:60,  tag:'web',   cls:'xp-web'   },
      { id:'q6', name:'No gaming before quests',sub:'Quests first, then game guilt-free',     xp:30,  tag:'bonus', cls:'xp-bonus' },
      { id:'q7', name:'Full day streak bonus',  sub:'Complete all 6 quests above',            xp:70,  tag:'bonus', cls:'xp-bonus' },
    ];

    const REWARDS = [
      { id:'r1', name:'Game session',    icon:'🎮', xp:100 },
      { id:'r2', name:'Takeout treat',   icon:'🍜', xp:200 },
      { id:'r3', name:'Movie night',     icon:'🎬', xp:250 },
      { id:'r4', name:'Buy a course',    icon:'📚', xp:350 },
      { id:'r5', name:'Full rest day',   icon:'🛋️', xp:400 },
    ];

    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    let state = JSON.parse(localStorage.getItem('questState') || 'null') || { done: [], xpByTag: { ai:0, dsa:0, web:0 } };

    function save() { localStorage.setItem('questState', JSON.stringify(state)); }

    function totalXP() {
      return state.done.reduce((sum, id) => {
        const q = QUESTS.find(q => q.id === id);
        return sum + (q ? q.xp : 0);
      }, 0);
    }

    function renderQuests() {
      const el = document.getElementById('questList');
      el.innerHTML = '';
      QUESTS.forEach(q => {
        const done = state.done.includes(q.id);
        const div = document.createElement('div');
        div.className = 'quest' + (done ? ' done' : '');
        div.innerHTML = `
          <div class="quest-check">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <polyline points="2,6 5,9 10,3" stroke="#0e0e12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="quest-info">
            <div class="quest-name">${q.name}</div>
            <div class="quest-sub">${q.sub}</div>
          </div>
          <span class="quest-xp ${q.cls}">+${q.xp} XP</span>
        `;
        div.onclick = () => toggleQuest(q.id);
        el.appendChild(div);
      });
    }

    function toggleQuest(id) {
      const q = QUESTS.find(q => q.id === id);
      if (state.done.includes(id)) {
        state.done = state.done.filter(x => x !== id);
        if (q.tag !== 'bonus') state.xpByTag[q.tag] = Math.max(0, (state.xpByTag[q.tag] || 0) - q.xp);
      } else {
        state.done.push(id);
        if (q.tag !== 'bonus') state.xpByTag[q.tag] = (state.xpByTag[q.tag] || 0) + q.xp;
        showToast('+' + q.xp + ' XP earned!');
        const mainDone = state.done.filter(x => !['q6','q7'].includes(x)).length;
        if (mainDone === 5 && !state.done.includes('q7')) {
          setTimeout(() => showToast('🔥 All quests done! Claim your streak bonus!'), 700);
        }
      }
      save();
      render();
    }

    function renderXP() {
      const xp = totalXP();
      document.getElementById('xpCount').textContent = xp + ' / 400 XP';
      document.getElementById('xpFill').style.width = Math.min(100, Math.round((xp / 400) * 100)) + '%';

      const tags  = ['ai', 'dsa', 'web'];
      const ids   = ['chip-ai', 'chip-dsa', 'chip-web'];
      const names = ['AI/RAG', 'DSA', 'Web'];
      tags.forEach((t, i) => {
        const pts = state.xpByTag[t] || 0;
        const lv  = Math.floor(pts / 150) + 1;
        document.getElementById(ids[i]).textContent = '⬡ ' + names[i] + ' — LV ' + lv;
      });
    }

    function renderRewards() {
      const xp = totalXP();
      const el = document.getElementById('rewardsGrid');
      el.innerHTML = '';
      REWARDS.forEach(r => {
        const unlocked = xp >= r.xp;
        const div = document.createElement('div');
        div.className = 'reward-card ' + (unlocked ? 'unlocked' : 'locked');
        div.innerHTML = `
          <div class="reward-icon">${r.icon}</div>
          <div class="reward-name">${r.name}</div>
          <div class="reward-xp">${r.xp} XP needed</div>
          ${unlocked ? '<div class="unlock-badge">✓ unlocked</div>' : ''}
        `;
        el.appendChild(div);
      });
    }

    function renderStreak() {
      const el = document.getElementById('streakRow');
      el.innerHTML = '';
      const today = new Date().getDay();
      DAYS.forEach((d, i) => {
        const div = document.createElement('div');
        div.className = 'streak-day' + (i === today ? ' active' : '');
        div.innerHTML = '<div class="dot"></div><div class="day-label">' + d + '</div>';
        el.appendChild(div);
      });
    }

    function renderDate() {
      document.getElementById('dateBadge').textContent = new Date().toLocaleDateString('en-IN', {
        weekday: 'short', day: 'numeric', month: 'short'
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function resetDay() {
      state.done = [];
      save();
      render();
      showToast("Day reset. Let's go!");
    }

    function render() {
      renderQuests();
      renderXP();
      renderRewards();
      renderStreak();
      renderDate();
    }

    render();
  </script>
</body>
</html>
